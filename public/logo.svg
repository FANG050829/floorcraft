<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 30" xml:space="preserve">
<defs>
  <style type="text/css">
    .fc-bg    { fill: #2D2D2D; stroke: #FFFFFF; stroke-width: 0.6317; stroke-miterlimit: 10; }
    .fc-line  { fill: none; stroke: #F4EFE4; stroke-width: 1.1; stroke-linecap: round; stroke-linejoin: round; }
    .fc-part  { fill: #C75B39; }
    .fc-part-top { fill: #E0785A; }
  </style>
</defs>

<!-- 轴测房间 + 家具块 -->
<g>
  <rect class="fc-bg" x="1.49" y="1.49" width="27.02" height="27.02" rx="4"/>
  <!-- 墙角与墙面 -->
  <path class="fc-line" d="M15,6 L15,17"/>
  <path class="fc-line" d="M15,6 L6,10.5"/>
  <path class="fc-line" d="M15,6 L24,10.5"/>
  <!-- 地面 -->
  <path class="fc-line" d="M15,17 L6,21.5 L15,26 L24,21.5 Z"/>
  <!-- 家具块（品牌色） -->
  <path class="fc-part-top" d="M15,18 L19,20 L15,22 L11,20 Z"/>
  <path class="fc-part" d="M11,20 L15,22 L15,24 L11,22 Z"/>
  <path class="fc-part" d="M19,20 L15,22 L15,24 L19,22 Z"/>
</g>
</svg>
